<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - macOS Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #f1f1f1; padding: 40px;">
    <div class="settings-layout" style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h1>System Settings</h1>
        <div class="settings-row">
            <span>Wi-Fi</span>
            <input type="checkbox" checked />
        </div>
        <div class="settings-row">
            <span>Bluetooth</span>
            <input type="checkbox" checked />
        </div>
        <div class="settings-row">
            <span>Dark Mode</span>
            <input type="checkbox" />
        </div>
        <div class="settings-row">
            <span>Volume</span>
            <input type="range" min="0" max="100" value="80" />
        </div>
    </div>
</body>
</html>
