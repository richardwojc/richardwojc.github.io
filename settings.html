<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - macOS Mockup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg-color); color: var(--text-color); padding: 20px; }
        .settings-layout { max-width: 600px; margin: 0 auto; background: var(--input-bg); padding: 20px; border-radius: 10px; box-shadow: var(--window-shadow); border: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="settings-layout">
        <h1>System Settings</h1>
        <div class="settings-row">
            <label>Wi-Fi</label>
            <input type="checkbox" checked />
        </div>
        <div class="settings-row">
            <label>Bluetooth</label>
            <input type="checkbox" checked />
        </div>
        <div class="settings-row">
            <label>Dark Mode</label>
            <input type="checkbox" id="dark-mode-toggle" />
        </div>
        <div class="settings-row">
            <label>Volume</label>
            <input type="range" min="0" max="100" value="80" />
        </div>
        <div class="settings-section">
            <h2>Users & Groups</h2>
            <div id="settings-user-list">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>
    <script>
        const toggle = document.getElementById('dark-mode-toggle');
        const settingsUserList = document.getElementById('settings-user-list');

        function renderSettingsUsers() {
            const users = JSON.parse(localStorage.getItem('mac_users')) || [];
            settingsUserList.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'settings-row';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${user.avatar}" style="width:30px; height:30px; border-radius:50%;">
                        <span>${user.name}</span>
                    </div>
                    <span style="opacity:0.6; font-size:12px;">Admin</span>
                `;
                settingsUserList.appendChild(div);
            });
        }
        renderSettingsUsers();

        // Initial state from parent or local body class
        toggle.checked = document.body.classList.contains('dark-mode');

        toggle.addEventListener('change', () => {
            const isDark = toggle.checked;
            if (isDark) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
            // Notify parent
            window.parent.postMessage({ type: 'toggle-dark-mode', isDark }, '*');
        });

        // Listen for parent theme changes
        window.addEventListener('message', (event) => {
            if (event.data.type === 'sync-dark-mode') {
                if (event.data.isDark) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
                toggle.checked = event.data.isDark;
            }
        });
    </script>
</body>
</html>
