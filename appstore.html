<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store - macOS Mockup</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--bg-color); color: var(--text-color); margin: 0; }
        .appstore-layout { height: 100vh; }
    </style>
</head>
<body>
    <div class="appstore-layout">
        <div class="appstore-sidebar">
            <div class="appstore-search"><input type="text" placeholder="Search" /></div>
            <div class="appstore-nav">
                <div class="appstore-nav-item active">Discover</div>
                <div class="appstore-nav-item">Arcade</div>
                <div class="appstore-nav-item">Create</div>
                <div class="appstore-nav-item">Work</div>
                <div class="appstore-nav-item">Play</div>
                <div class="appstore-nav-item">Develop</div>
                <div class="appstore-nav-item">Categories</div>
                <div class="appstore-nav-item">Updates</div>
            </div>
        </div>
        <div class="appstore-content">
            <h1>Discover</h1>
            <div class="app-grid">
                <div class="app-card">
                    <div class="app-card-icon">🎮</div>
                    <div class="app-card-info">
                        <h3>Epic Game</h3>
                        <p>Action & Adventure</p>
                    </div>
                    <button class="app-get-btn">GET</button>
                </div>
                <div class="app-card">
                    <div class="app-card-icon">🎨</div>
                    <div class="app-card-info">
                        <h3>Design Pro</h3>
                        <p>Creativity</p>
                    </div>
                    <button class="app-get-btn">GET</button>
                </div>
                <div class="app-card">
                    <div class="app-card-icon">📁</div>
                    <div class="app-card-info">
                        <h3>File Master</h3>
                        <p>Utilities</p>
                    </div>
                    <button class="app-get-btn">GET</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
