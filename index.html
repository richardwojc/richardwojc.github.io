<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-content">
            <div class="user-avatar">👤</div>
            <div class="user-name">User</div>
            <div class="password-field">
                <input type="password" id="login-password" placeholder="Enter Password" />
                <button id="login-btn">→</button>
            </div>
            <div class="login-footer">
                <span>Sleep</span>
                <span>Restart</span>
                <span>Shut Down</span>
            </div>
        </div>
    </div>

    <div id="desktop" style="display: none;">
        <div id="spotlight-overlay" style="display: none;">
            <div class="spotlight-search">
                <span class="spotlight-icon">🔍</span>
                <input type="text" id="spotlight-input" placeholder="Spotlight Search" />
            </div>
            <div id="spotlight-results">
                <!-- Search results will appear here -->
            </div>
        </div>
        <header id="menu-bar">
            <div class="menu-left">
                <span class="apple-logo"></span>
                <span class="app-name">Finder</span>
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Go</span>
                <span class="menu-item">Window</span>
                <span class="menu-item">Help</span>
            </div>
            <div class="menu-right">
                <span class="status-item" id="spotlight-btn">🔍</span>
                <span class="status-item">Wi-Fi</span>
                <span class="status-item">Battery</span>
                <span id="clock"></span>
            </div>
        </header>

        <main id="window-container">
            <div id="desktop-icons">
                <div class="desktop-icon" data-app="finder">
                    <div class="icon-box">📁</div>
                    <span>Macintosh HD</span>
                </div>
            </div>
            <!-- Windows will be rendered here -->
        </main>

        <div id="launchpad" style="display: none;">
            <div class="launchpad-grid">
                <div class="launchpad-item" data-app="finder">
                    <div class="launchpad-icon">📁</div>
                    <span>Finder</span>
                </div>
                <div class="launchpad-item" data-app="safari">
                    <div class="launchpad-icon">🌐</div>
                    <span>Safari</span>
                </div>
                <div class="launchpad-item" data-app="notes">
                    <div class="launchpad-icon">📝</div>
                    <span>Notes</span>
                </div>
                <div class="launchpad-item" data-app="calculator">
                    <div class="launchpad-icon">🔢</div>
                    <span>Calculator</span>
                </div>
                <div class="launchpad-item" data-app="settings">
                    <div class="launchpad-icon">⚙️</div>
                    <span>Settings</span>
                </div>
                <div class="launchpad-item" data-app="terminal">
                    <div class="launchpad-icon">📟</div>
                    <span>Terminal</span>
                </div>
                <div class="launchpad-item" data-app="appstore">
                    <div class="launchpad-icon">🏬</div>
                    <span>App Store</span>
                </div>
            </div>
        </div>

        <footer id="dock-container">
            <div id="dock">
                <div class="dock-item" id="launchpad-trigger" title="Launchpad">
                    <div class="icon-placeholder">🚀</div>
                </div>
                <div class="dock-divider"></div>
                <div class="dock-item" data-app="finder" title="Finder">
                    <div class="icon-placeholder">📁</div>
                </div>
                <div class="dock-item" data-app="safari" title="Safari">
                    <div class="icon-placeholder">🌐</div>
                </div>
                <div class="dock-item" data-app="notes" title="Notes">
                    <div class="icon-placeholder">📝</div>
                </div>
                <div class="dock-item" data-app="calculator" title="Calculator">
                    <div class="icon-placeholder">🔢</div>
                </div>
                <div class="dock-item" data-app="settings" title="System Settings">
                    <div class="icon-placeholder">⚙️</div>
                </div>
                <div class="dock-item" data-app="terminal" title="Terminal">
                    <div class="icon-placeholder">📟</div>
                </div>
                <div class="dock-item" data-app="appstore" title="App Store">
                    <div class="icon-placeholder">🏬</div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Window Template -->
    <template id="window-template">
        <div class="window" style="top: 100px; left: 100px;">
            <div class="window-header">
                <div class="traffic-lights">
                    <div class="traffic-light close"></div>
                    <div class="traffic-light minimize"></div>
                    <div class="traffic-light maximize"></div>
                </div>
                <div class="window-title">App Name</div>
            </div>
            <div class="window-content">
                <!-- App content goes here -->
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
