<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finder - macOS Mockup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: white;">
    <div class="finder-layout" style="height: 100vh;">
        <div class="sidebar">
            <ul class="folder-list">
                <li class="folder-item active">Favorites</li>
                <li class="folder-item">Applications</li>
                <li class="folder-item">Desktop</li>
                <li class="folder-item">Documents</li>
                <li class="folder-item">Downloads</li>
            </ul>
        </div>
        <div class="file-grid">
            <div class="file-item">
                <div class="file-icon"></div>
                <span>Project 1</span>
            </div>
            <div class="file-item">
                <div class="file-icon"></div>
                <span>Resume.pdf</span>
            </div>
        </div>
    </div>
</body>
</html>
